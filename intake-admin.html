<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Client intakes • Claire Thomas</title>
		<link rel="icon" href="./assets/claire-thomas-logo.png" type="image/png" />
		<link rel="stylesheet" href="./admin.css" />
		<link rel="stylesheet" href="./intake-admin.css" />
	</head>
	<body>
		<main class="admin-app">
			<section id="login-view" class="login-view" hidden>
				<form id="login-form" class="login-card">
					<p class="eyebrow">Claire Thomas</p>
					<h1>Client intakes</h1>
					<label>
						<span>Email</span>
						<input id="login-email" name="email" type="email" autocomplete="username" required />
					</label>
					<label>
						<span>Password</span>
						<input id="login-password" name="password" type="password" autocomplete="current-password" required />
					</label>
					<button type="submit">Sign in</button>
					<p id="login-error" class="form-error" role="alert" hidden></p>
				</form>
			</section>

			<section id="dashboard-view" class="dashboard" hidden>
				<header class="admin-header">
					<div>
						<p class="eyebrow">Claire Thomas</p>
						<h1>Client intakes</h1>
					</div>
					<div class="header-actions">
						<a href="./admin.html">Portfolio admin</a>
						<button id="logout-button" class="quiet-button" type="button">Sign out</button>
					</div>
				</header>
				<nav class="ia-tabs" aria-label="Sections">
					<a href="#intakes" data-tab="intakes">Intakes</a>
					<a href="#poses" data-tab="poses">Poses</a>
					<a href="#questions" data-tab="questions">Questions</a>
					<a href="#types" data-tab="types">Event types &amp; tags</a>
				</nav>
				<div id="system-message" class="system-message" role="status" hidden></div>
				<div id="view" class="ia-view"></div>
			</section>
		</main>
		<script src="./intake-admin.js"></script>
	</body>
</html>
