name: Portfolio shop sync

on:
  workflow_dispatch:
    inputs:
      continuation:
        description: "Bounded retry continuation number"
        required: false
        default: "0"

concurrency:
  group: portfolio-shop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      retryable: ${{ steps.reconcile.outputs.retryable }}
    permissions:
      contents: read
    env:
      PORTFOLIO_CONTENT_URL: https://clairethomas.art/api/content
      GELATO_API_KEY: ${{ secrets.GELATO_API_KEY }}
      GELATO_STORE_ID: ${{ secrets.GELATO_STORE_ID }}
      GELATO_FINE_ART_TEMPLATE_ID: ${{ secrets.GELATO_FINE_ART_TEMPLATE_ID }}
      GELATO_429_MAX_ATTEMPTS: "48"
      SHOPIFY_STORE_DOMAIN: esf4bj-wk.myshopify.com
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_API_VERSION: "2026-07"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify synchronization code
        run: npm run check
      - name: Restore restart-safe catalog state
        uses: actions/cache/restore@v4
        with:
          path: |
            .gelato-product-state.json
            .portfolio-print-sync-state.json
          key: portfolio-shop-state-${{ github.run_id }}
          restore-keys: |
            portfolio-shop-state-
      - name: Reconcile portfolio and print shop
        id: reconcile
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 330m node scripts/portfolio-print-sync.mjs --execute
          status=$?
          if [ "$status" -eq 75 ]; then
            echo "retryable=true" >> "$GITHUB_OUTPUT"
          else
            echo "retryable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Persist restart-safe catalog state
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            .gelato-product-state.json
            .portfolio-print-sync-state.json
          key: portfolio-shop-state-${{ github.run_id }}
      - name: Strict catalog audit
        run: node scripts/gelato-products.mjs --strict-audit --content-url "$PORTFOLIO_CONTENT_URL"

  continuation:
    if: ${{ always() && needs.sync.result == 'failure' && needs.sync.outputs.retryable == 'true' && fromJSON(inputs.continuation) < 5 }}
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Continue the button-triggered sync after a bounded failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const current = Number(context.payload.inputs?.continuation ?? "0");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "portfolio-shop-sync.yml",
              ref: context.ref.replace(/^refs\/heads\//, ""),
              inputs: { continuation: String(current + 1) },
            });
