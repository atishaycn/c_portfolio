<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<title>Your shoot • Claire Thomas</title>
		<link rel="icon" href="/assets/claire-thomas-logo.png" type="image/png" />
		<link rel="stylesheet" href="/intake.css" />
	</head>
	<body>
		<header class="intake-header">
			<a href="/" class="intake-brand"><img src="/assets/claire-thomas-logo.png" alt="" width="28" height="28" />Claire Thomas</a>
			<span id="save-state" class="save-state" aria-live="polite"></span>
		</header>
		<div id="progress" class="progress" hidden><div id="progress-bar" class="progress-bar"></div></div>
		<main id="intake" class="intake" aria-live="polite">
			<p class="loading">Loading your intake…</p>
		</main>
		<p class="privacy-note">
			Claire uses your answers only to plan your shoot. They're kept privately and deleted when you ask.
		</p>
		<script src="/intake.js"></script>
	</body>
</html>
